<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>نظرسنجی وضعیت راه‌های استان اصفهان</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .poll-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            margin: 0 0 12px;
            line-height: 1.7;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            border: 2px solid #e1e5ea;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }

        .option:hover {
            border-color: #1976d2;
            background: #f7fbff;
        }

        .option input {
            margin-left: 12px;
            width: 19px;
            height: 19px;
        }

        .option span {
            line-height: 1.7;
            font-size: 15px;
        }

        .vote-btn {
            width: 100%;
            border: none;
            background: #1976d2;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .vote-btn:hover {
            background: #125ca5;
        }

        .vote-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            text-align: center;
            background: #e8f5e9;
            color: #267a31;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .result-item {
            margin-bottom: 20px;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 7px;
        }

        .percentage {
            font-weight: bold;
            color: #1976d2;
            white-space: nowrap;
        }

        .bar {
            width: 100%;
            height: 14px;
            background: #e9edf1;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #1976d2;
            border-radius: 20px;
            transition: width 0.8s ease;
        }

        .total-votes {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .poll-box {
                padding: 18px;
            }

            .header h1 {
                font-size: 19px;
            }

            .question {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="poll-box">

        <div class="header">

            <h1>نظرسنجی</h1>

            <p>
                وضعیت راه‌های استان اصفهان
            </p>

        </div>


        <div class="question">

            اطلاعات مربوط به وضعیت راه‌های استان اصفهان را معمولاً از چه طریقی دریافت می‌کنید؟

        </div>


        <div class="options">

            <label class="option">

                <input
                    type="radio"
                    name="poll"
                    value="0">

                <span>
                    سامانه ۱۴۱ (تلفن گویا، سایت یا اپلیکیشن)
                </span>

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="poll"
                    value="1">

                <span>
                    مسیریاب‌ها و سکوهای هوشمند
                </span>

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="poll"
                    value="2">

                <span>
                    رسانه‌ها و شبکه‌های اجتماعی
                </span>

            </label>


            <label class="option">

                <input
                    type="radio"
                    name="poll"
                    value="3">

                <span>
                    تابلوهای جاده‌ای و اطلاع‌رسانی‌های میدانی راهداری و پلیس
                </span>

            </label>

        </div>


        <button
            class="vote-btn"
            id="voteButton"
            onclick="submitVote()">

            ثبت رأی

        </button>


        <div
            class="message"
            id="message">

            ✅ رأی شما با موفقیت ثبت شد.

        </div>


        <div
            class="results"
            id="results">

            <h2>
                📊 نتایج نظرسنجی
            </h2>


            <div class="result-item">

                <div class="result-title">

                    <span>
                        سامانه ۱۴۱ (تلفن گویا، سایت
